[package]
name = "blender_mcp_core"
version = "0.3.0"
edition = "2021"
authors = ["Blender MCP Rust Contributors"]
description = "High-performance Rust + PyO3 MCP Server for Blender 5.x"
license = "GPL-3.0-or-later"

[lib]
name = "blender_mcp_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "macros", "time", "net"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
crossbeam-channel = "0.5"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1.20"
futures-util = "0.3"
async-stream = "0.3"
